# Conversion to YAML from Properties formar report
# Warnings:
# - The yaml file had comments which are lost in the refactoring!
spring:
  application:
    name: EShopDemo
  datasource:
    url: jdbc:mysql://localhost:3306/prod_eshop_db?createDatabaseIfNotExist=true
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
logging:
  file:
    name: eshop.log
user:
  profile:
    image:
      path: images/users/
product:
  image:
    path: images/products/
